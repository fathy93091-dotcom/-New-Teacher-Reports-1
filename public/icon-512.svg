<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#blueGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="240" r="170" fill="#2563eb" opacity="0.12" filter="url(#glow)" />

  <!-- Stars Background Accents -->
  <polygon points="120,130 126,144 140,144 129,153 133,167 120,158 107,167 111,153 100,144 114,144" fill="url(#goldGrad)" opacity="0.85" />
  <polygon points="392,140 397,152 410,152 400,160 404,172 392,164 380,172 384,160 374,152 387,152" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Center Glowing Big Star -->
  <polygon points="256,70 273,115 320,117 283,147 296,193 256,166 216,193 229,147 192,117 239,115" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Graduation Cap (mortarboard) -->
  <g transform="translate(0, 30)">
    <!-- Cap Top Rhombus -->
    <polygon points="256,165 410,225 256,285 102,225" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="4" />
    
    <!-- Cap Under Skullcap -->
    <path d="M165,248 L165,300 C165,340 347,340 347,300 L347,248" fill="#1e3a8a" stroke="#3b82f6" stroke-width="3" />
    
    <!-- Tassel -->
    <circle cx="256" cy="225" r="7" fill="#fbbf24" />
    <path d="M256,225 Q360,240 365,310" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
    <polygon points="360,310 370,310 372,345 358,345" fill="url(#goldGrad)" />
  </g>

  <!-- Open Book Symbol (Bottom) -->
  <g transform="translate(0, 45)">
    <!-- Left Page -->
    <path d="M256,380 C210,345 150,345 110,355 L110,410 C150,400 210,400 256,435 Z" fill="#ffffff" opacity="0.95" />
    <!-- Right Page -->
    <path d="M256,380 C302,345 362,345 402,355 L402,410 C362,400 302,400 256,435 Z" fill="#f1f5f9" opacity="0.95" />
    
    <!-- Book Spine / Center Glow -->
    <path d="M256,375 L256,440" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Page Lines Left -->
    <line x1="135" y1="375" x2="230" y2="370" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="135" y1="390" x2="225" y2="385" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    
    <!-- Page Lines Right -->
    <line x1="282" y1="370" x2="377" y2="375" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
    <line x1="287" y1="385" x2="377" y2="390" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Text "GoStars" at bottom curve -->
  <text x="256" y="475" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4">GOSTARS</text>
</svg>
