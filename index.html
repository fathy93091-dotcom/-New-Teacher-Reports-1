<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GoStars" />
    <meta name="application-name" content="GoStars Assistant" />
    <meta name="msapplication-TileColor" content="#020617" />
    
    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />
    
    <title>GoStars Assistant - نظام إدارة المعلم والمتابعة الذكية</title>
    <meta name="description" content="GoStars Assistant الشامل لإدارة المعلم والدروس والطلاب والحسابات المالية وتقارير الذكاء الاصطناعي" />
    <meta property="og:title" content="GoStars Assistant - نظام إدارة المعلم والمتابعة الذكية" />
    <meta property="og:description" content="GoStars Assistant الشامل لإدارة المعلم والدروس والطلاب والحسابات المالية وتقارير الذكاء الاصطناعي" />
    
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.message === 'WebSocket closed without opened.' || (typeof event.reason === 'string' && event.reason.includes('WebSocket')))) {
          event.preventDefault();
        }
      });

      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.debug('ServiceWorker registration ignored/failed in this environment:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-[#f6f9f6] text-slate-800 selection:bg-emerald-200 selection:text-emerald-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
